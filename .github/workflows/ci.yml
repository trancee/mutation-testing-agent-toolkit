name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Kotlin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify Copilot adapter bootstrap
        run: bash scripts/test-bootstrap-copilot.sh
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up Kotlin test harness
        run: |
          mkdir -p /tmp/ci-test/src/main/kotlin/io/omp/mutation
          mkdir -p /tmp/ci-test/src/test/kotlin/io/omp/mutation
          cp .omp/mutation-results-src/main/kotlin/io/omp/mutation/*.kt /tmp/ci-test/src/main/kotlin/io/omp/mutation/
          cp .omp/mutation-results-src/test/kotlin/io/omp/mutation/*.kt /tmp/ci-test/src/test/kotlin/io/omp/mutation/
      - name: Write build.gradle.kts (standalone, non-kotlin-dsl)
        run: |
          cat > /tmp/ci-test/build.gradle.kts << 'EOF'
          plugins {
              kotlin("jvm") version "2.4.0"
              kotlin("plugin.serialization") version "2.4.0"
          }
          repositories { mavenCentral() }
          dependencies {
              implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1")
              testImplementation("org.junit.jupiter:junit-jupiter-api:6.1.3")
              testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:6.1.3")
              testRuntimeOnly("org.junit.platform:junit-platform-launcher:6.1.3")
          }
          kotlin { jvmToolchain(21) }
          tasks.test { useJUnitPlatform() }
          EOF
      - name: Write settings.gradle.kts
        run: echo "rootProject.name = \"mutation-toolkit-ci-test\"" > /tmp/ci-test/settings.gradle.kts
      - name: Run tests
        run: |
          cd /tmp/ci-test
          for i in 1 2 3; do
            if gradle test --console=plain --no-daemon; then
              exit 0
            fi
            echo "Gradle attempt $i failed."
            if [ "$i" -lt 3 ]; then
              echo "Retrying in 10s..."
              sleep 10
            fi
          done
          echo "Gradle tests failed after 3 attempts." >&2
          exit 1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: /tmp/ci-test/build/test-results/

  lint:
    name: Markdown / YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install actionlint
        run: |
          mkdir -p /tmp/actionlint
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_linux_amd64.tar.gz" | tar -xz -C /tmp/actionlint actionlint
          sudo install -m 0755 /tmp/actionlint/actionlint /usr/local/bin/actionlint
          actionlint --version
      - name: Install lychee
        run: |
          mkdir -p /tmp/lychee
          curl -fsSL "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /tmp/lychee --strip-components=1
          sudo install -m 0755 /tmp/lychee/lychee /usr/local/bin/lychee
          lychee --version
      - name: Install yamllint
        run: python3 -m pip install --user yamllint==1.38.0
      - name: Validate GitHub Actions workflows
        run: actionlint .github/workflows/ci.yml
      - name: Validate Copilot agent profiles
        run: python3 scripts/check-copilot-agent-profiles.py
      - name: Validate shared mutation-agent contracts
        run: python3 scripts/check-mutation-agent-contracts.py
      - name: Markdown lint + link check
        run: ./scripts/check-markdown.sh --offline
      - name: YAML lint
        run: yamllint --strict .omp/skills/mutation-test/agents/openai.yaml .github/workflows/ci.yml
